<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
  </head>
  <body>
    <h2>LOGIN</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="ID" required /><br />
      <input
        type="password"
        name="password"
        placeholder="password"
        required
      /><br />
      <button type="submit">login</button>
    </form>
    {% if request.session.error != None %}
    <p style="color: red">{{ request.session.error }}</p>
    {% endif %}
  </body>
</html>
